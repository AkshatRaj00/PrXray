name: Contributor Welcome & First Interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome New Contributor
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 **Welcome to PR-XRay Systems Lab!**
            
            Thank you for raising this issue. Our automated triage system has logged your report.
            Please ensure you have included reproducible steps and terminal logs. A maintainer will follow up shortly.
          pr-message: |
            🚀 **Welcome to PR-XRay!**
            
            Thank you for opening your first pull request. The automated test pipeline will validate your diff against our client-side WebGPU/Wasm benchmarks.