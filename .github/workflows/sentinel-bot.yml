name: Sentinel Autonomous Bot Engine

on:
  schedule:
    # Runs automatically every midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/sentinel-heartbeat.json'
      - 'README.md'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bot-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Tree
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Strict Build Verification
        run: npm run build

      - name: Generate Cryptographic Health Heartbeat
        run: |
          mkdir -p .github
          cat <<EOF > .github/sentinel-heartbeat.json
          {
            "engine": "PR-XRay Autonomous Sentinel",
            "status": "HEALTHY",
            "last_verified_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "commit_sha": "${{ github.sha }}",
            "environment": "Production V8 Wasm SIMD128",
            "maintainer": "OnePersonAI Systems Lab",
            "verified_by": "github-actions[bot]"
          }
          EOF

      - name: Autonomous GitHub Action Bot Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/sentinel-heartbeat.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No telemetry changes detected. Clean working tree."
          else
            git commit -m "chore(sentinel): autonomous health pulse verification [skip ci]"
            git push origin main
          fi