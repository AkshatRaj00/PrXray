name: PR & Issue Auto-Triage Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-Label Changed Paths
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            const labels = new Set();
            for (const file of files.data) {
              if (file.filename.startsWith('src/lib/engines/')) labels.add('area:sast-engine');
              if (file.filename.startsWith('src/lib/workers/')) labels.add('area:neural-copilot');
              if (file.filename.startsWith('src/components/')) labels.add('area:frontend-ui');
              if (file.filename.includes('security') || file.filename.includes('notify')) labels.add('security');
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels)
              });
            }